# Bhupendra VyronOS baseline security policy (configuration intent)
# These values are policy inputs; they are not enforced until installer scripts apply and test them.
VYRON_FIREWALL="ufw"
VYRON_FIREWALL_DEFAULT_INCOMING="deny"
VYRON_FIREWALL_DEFAULT_OUTGOING="allow"
VYRON_FIREWALL_ALLOW_SSH="false"
VYRON_ENABLE_APPARMOR="true"
VYRON_ENABLE_AUDITD="true"
VYRON_DISABLE_ROOT_SSH="true"
VYRON_REQUIRE_USER_PASSWORD="true"
VYRON_AUTOMATIC_SECURITY_UPDATES="true"
VYRON_ANALYST_USB_STORAGE_BLOCK="false"
# USB blocking is opt-in: it can disrupt legitimate devices and is not a complete DLP control.
# Full disk encryption should be offered at installation, not silently enabled after installation.
VYRON_RECOMMEND_FULL_DISK_ENCRYPTION="true"
# Do not place passwords, tokens, private keys, or datasets in build files or ISO images.
