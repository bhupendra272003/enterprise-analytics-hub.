# Bhupendra VyronOS workspace roles (application-level policy target)
# Linux groups provide coarse local access only. Workspace/API must enforce authorization.
VYRON_ROLE_OWNER="owner"
VYRON_ROLE_MANAGER="manager"
VYRON_ROLE_LEADER="leader"
VYRON_ROLE_ANALYST="analyst"

# Permission matrix reference
# OWNER: manage organizations, users, policy, and all workspaces
# MANAGER: manage assigned team/project scope, no global OS administration
# LEADER: review and coordinate assigned team scope
# ANALYST: approved datasets and assigned analysis tools only
# No shared accounts; provision individual users. No secrets embedded in ISO.
