# Vyron role/group mapping plan
# OS groups are supporting controls, not substitutes for app-level RBAC.
VYRON_ROLE_OWNER="vyron-owner"
VYRON_ROLE_MANAGER="vyron-manager"
VYRON_ROLE_LEADER="vyron-leader"
VYRON_ROLE_ANALYST="vyron-analyst"

# Baseline groups
VYRON_COMMON_GROUPS="vyron-users"
VYRON_DATA_GROUP="vyron-data"
VYRON_AUDIT_GROUP="vyron-audit"

# Planned policy:
# OWNER: administrative management, but no shared/root account; sudo access
# MANAGER: manage team projects and approved workspace resources; no sudo
# LEADER: team-level collaboration and review; no sudo
# ANALYST: approved datasets and tools only; no sudo
# Service secrets are not exposed to desktop users.
# Accounts are created on installation, never baked with shared passwords.
