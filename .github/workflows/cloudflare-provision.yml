name: Provision Cloudflare Free Resources

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  provision:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate Cloudflare credentials
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CF_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN repository secret"; exit 1; }
          test -n "$CF_ACCOUNT_ID" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID repository secret"; exit 1; }
      - name: Create or reuse D1, R2 and Queue resources
        id: resources
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
        run: |
          set -euo pipefail
          api() {
            curl --fail-with-body --silent --show-error --retry 4 --retry-all-errors --retry-delay 3 \
              -H "Authorization: Bearer $CF_TOKEN" \
              -H "Content-Type: application/json" "$@"
          }

          # Prefer a supplied ID for the existing database. Otherwise discover it by name.
          d1_id="${CF_D1_DATABASE_ID:-}"
          if [ -z "$d1_id" ]; then
            echo "Discovering existing D1 database nexus-analytics..."
            d1_list=$(api "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/d1/database?name=nexus-analytics&per_page=100") || {
              echo "::error::Cloudflare D1 discovery failed after retries. If the database already exists, add its ID as CLOUDFLARE_D1_DATABASE_ID repository secret to bypass discovery."
              exit 1
            }
            d1_id=$(echo "$d1_list" | jq -r '.result[]? | select(.name=="nexus-analytics") | .uuid' | head -n1)
          fi
          if [ -z "$d1_id" ]; then
            echo "D1 database not found; creating nexus-analytics..."
            d1_created=$(api -X POST -d '{"name":"nexus-analytics"}' "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/d1/database")
            d1_id=$(echo "$d1_created" | jq -r '.result.uuid // empty')
          fi
          test -n "$d1_id" || { echo "::error::Could not create or find D1 database"; exit 1; }
          echo "Using D1 database ID supplied/discovered successfully."

          r2_list=$(api "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/r2/buckets")
          r2_exists=$(echo "$r2_list" | jq -r '.result.buckets[]? | select(.name=="nexus-analytics-datasets") | .name' | head -n1)
          if [ -z "$r2_exists" ]; then
            api -X POST -d '{"name":"nexus-analytics-datasets"}' "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/r2/buckets" >/dev/null
          fi

          queue_list=$(api "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/queues")
          queue_exists=$(echo "$queue_list" | jq -r '.result[]? | select(.queue_name=="nexus-dataset-jobs") | .queue_name' | head -n1)
          if [ -z "$queue_exists" ]; then
            api -X POST -d '{"queue_name":"nexus-dataset-jobs"}' "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/queues" >/dev/null
          fi
          echo "d1_id=$d1_id" >> "$GITHUB_OUTPUT"
          echo "D1 database, R2 bucket and Queue are ready."
      - name: Apply D1 migrations
        working-directory: apps/api-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_ID: ${{ steps.resources.outputs.d1_id }}
        run: |
          python - <<'PY'
          import json, os
          path = "wrangler.jsonc"
          data = json.load(open(path))
          data["d1_databases"][0]["database_id"] = os.environ["D1_ID"]
          open(path, "w").write(json.dumps(data, indent=2) + "\n")
          PY
          npx --yes wrangler@latest d1 migrations apply nexus-analytics --remote
      - name: Save D1 identifier in Wrangler configuration
        env:
          D1_ID: ${{ steps.resources.outputs.d1_id }}
        run: |
          python - <<'PY'
          import json, os
          path = "apps/api-worker/wrangler.jsonc"
          data = json.load(open(path))
          data["d1_databases"][0]["database_id"] = os.environ["D1_ID"]
          open(path, "w").write(json.dumps(data, indent=2) + "\n")
          PY
          if ! git diff --quiet -- apps/api-worker/wrangler.jsonc; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add apps/api-worker/wrangler.jsonc
            git commit -m "Configure Cloudflare D1 database identifier"
            git push
          fi
      - name: Publish setup summary
        env:
          D1_ID: ${{ steps.resources.outputs.d1_id }}
        run: |
          {
            echo "## Cloudflare resources provisioned"
            echo "- D1 database: `nexus-analytics`"
            echo "- D1 identifier saved in `apps/api-worker/wrangler.jsonc`"
            echo "- R2 bucket: `nexus-analytics-datasets`"
            echo "- Queue: `nexus-dataset-jobs`"
            echo "- D1 migrations applied remotely."
            echo ""
            echo "No Worker was deployed. Set the final frontend origin before deploying the API Worker."
          } >> "$GITHUB_STEP_SUMMARY"
