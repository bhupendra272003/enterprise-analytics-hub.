name: Deploy NEXUS to Cloudflare Free

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/web/app/page.tsx'
      - 'apps/web/next.config.mjs'
      - 'apps/api-worker/src/index.ts'
      - '.github/workflows/cloudflare-deploy.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate Cloudflare credentials
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CF_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN repository secret"; exit 1; }
          test -n "$CF_ACCOUNT_ID" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID repository secret"; exit 1; }
      - name: Deploy frontend and capture URL
        id: frontend
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Proxy browser API requests through the frontend origin to avoid CORS.
          API_PROXY_TARGET: https://nexus-analytics-api.bhupendrasinghdeora24.workers.dev
        run: |
          set -euo pipefail
          npm install
          npx opennextjs-cloudflare build
          npx wrangler deploy 2>&1 | tee deploy.log
          url=$(grep -Eo 'https://[A-Za-z0-9.-]+[.]workers[.]dev' deploy.log | tail -n1)
          test -n "$url" || { echo "::error::Could not detect the frontend workers.dev URL"; exit 1; }
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Apply D1 migrations and deploy API Worker
        id: api
        working-directory: apps/api-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FRONTEND_URL: ${{ steps.frontend.outputs.url }}
          MAIL_API_KEY: ${{ secrets.MAIL_API_KEY }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
        run: |
          set -euo pipefail
          npm install
          npx wrangler d1 migrations apply nexus-analytics --remote
          npx wrangler deploy --var "APP_ORIGIN:$FRONTEND_URL" 2>&1 | tee deploy.log
          # Provision email secrets on every deployment when repository secrets exist.
          if [ -n "${MAIL_API_KEY:-}" ] && [ -n "${MAIL_FROM:-}" ]; then
            printf %s "$MAIL_API_KEY" | npx wrangler secret put MAIL_API_KEY
            printf %s "$MAIL_FROM" | npx wrangler secret put MAIL_FROM
            echo "Email delivery secrets were provisioned."
          else
            echo "::warning::MAIL_API_KEY / MAIL_FROM GitHub repository secrets are missing; signup email delivery will remain disabled."
          fi
          url=$(grep -Eo 'https://[A-Za-z0-9.-]+[.]workers[.]dev' deploy.log | tail -n1)
          test -n "$url" || { echo "::error::Could not detect the API workers.dev URL"; exit 1; }
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Publish deployment URLs
        env:
          FRONTEND_URL: ${{ steps.frontend.outputs.url }}
          API_URL: ${{ steps.api.outputs.url }}
        run: |
          {
            echo "## NEXUS Cloudflare deployment"
            echo "- Frontend: $FRONTEND_URL"
            echo "- API Worker: $API_URL"
            echo "- Health check: $API_URL/health"
            echo ""
            echo "Email verification requires MAIL_API_KEY and MAIL_FROM Worker secrets before signup can send email."
          } >> "$GITHUB_STEP_SUMMARY"
