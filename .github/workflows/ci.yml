name: VYRON CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate API JavaScript syntax
        run: |
          cd apps/api
          npm install
          find src -name "*.js" -print0 | xargs -0 -n1 node --check
          npm test
      - name: Validate Python cleaning engine
        run: |
          cd apps/api
          python -m unittest discover -s python -p 'test_*.py' -v
      - name: Validate all Cloudflare D1 migrations
        run: |
          python - <<'PY'
          import sqlite3
          from pathlib import Path
          db = sqlite3.connect(":memory:")
          db.execute("PRAGMA foreign_keys = ON")
          migrations = sorted(Path("database/d1").glob("*.sql"))
          assert migrations, "No D1 migrations found"
          for migration in migrations:
              db.executescript(migration.read_text())
              print(f"Applied {migration.name}")
          tables = {row[0] for row in db.execute("SELECT name FROM sqlite_master WHERE type='table'")}
          expected = {"users", "organizations", "memberships", "invitations", "audit_logs", "organization_access_requests", "projects", "tasks", "datasets", "dataset_versions", "dataset_validation_runs", "dataset_anomaly_runs", "reports", "notifications", "auth_tokens", "sessions", "auth_attempts", "dataset_jobs", "teams", "team_members", "task_assignment_history", "work_events", "performance_corrections", "generator_settings", "generation_jobs", "analytics_dashboards", "dataset_handoffs"}
          missing = expected - tables
          assert not missing, f"Missing D1 tables: {sorted(missing)}"
          task_columns = {row[1] for row in db.execute("PRAGMA table_info(tasks)")}
          assert {"team_id", "assigned_by", "completed_at"} <= task_columns, "Missing team task evidence columns"
          generation_columns = {row[1] for row in db.execute("PRAGMA table_info(generation_jobs)")}
          assert {"project_id", "team_id", "requested_rows", "generated_rows"} <= generation_columns, "Generation jobs must retain project/team and row progress"
          membership_sql = db.execute("SELECT sql FROM sqlite_master WHERE type='table' AND name='memberships'").fetchone()[0]
          assert all(role in membership_sql for role in ("OWNER", "MANAGER", "LEADER", "ANALYST")), "Four-role membership constraint missing"
          assert not list(db.execute("PRAGMA foreign_key_check")), "D1 foreign key violations detected"
          print(f"D1 schema valid: {len(expected)} tables created, team columns and four roles verified.")
          PY
      - name: Type-check Cloudflare API Worker
        run: |
          cd apps/api-worker
          npm install
          npm audit --audit-level=moderate
          npm run typecheck
          node --test test/*.test.mjs
      - name: Build web application
        run: |
          cd apps/web
          npm install
          npm audit --audit-level=moderate
          npm run test:unit
          npm run build
          npm run cf:build
      - name: Validate Cloudflare deployment bindings and queue configuration
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          api = json.loads(Path("apps/api-worker/wrangler.jsonc").read_text())
          web = json.loads(Path("apps/web/wrangler.jsonc").read_text())
          queues = {item["queue"] for item in api.get("queues", {}).get("producers", [])}
          required = {"nexus-dataset-jobs", "vyron-generation-jobs"}
          assert required <= queues, f"Missing queue producers: {sorted(required - queues)}"
          assert any(item.get("binding") == "DATASETS" for item in api.get("kv_namespaces", [])), "Private dataset KV binding missing"
          assert any(item.get("binding") == "API" and item.get("service") == api["name"] for item in web.get("services", [])), "Frontend API service binding does not match API Worker name"
          deploy = Path(".github/workflows/cloudflare-deploy.yml").read_text()
          assert "workflow_dispatch:" in deploy and "push:" in deploy, "Production deployment must support validated main-branch pushes and manual dispatch"
          assert all(queue in deploy for queue in required), "Deploy workflow must provision both queues"
          print("Cloudflare bindings, both queue producers, and manual-only deployment verified.")
          PY
      - name: Validate PKDD Financial project assets
        run: |
          python -m py_compile projects/financial-analytics/python/profile_financial.py projects/financial-analytics/python/export_source_tables.py projects/financial-analytics/python/build_analytics.py projects/financial-analytics/python/validate_exports.py
          python -m unittest discover -s projects/financial-analytics/python -p 'test_*.py' -v
