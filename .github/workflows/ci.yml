name: NEXUS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate API JavaScript syntax
        run: |
          cd apps/api
          npm install
          find src -name "*.js" -print0 | xargs -0 -n1 node --check
      - name: Validate Python cleaning engine
        run: |
          cd apps/api
          python -m unittest discover -s python -p 'test_*.py' -v
      - name: Build web application
        run: |
          cd apps/web
          npm install
          npm run build
