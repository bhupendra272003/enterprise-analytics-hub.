name: NEXUS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate API JavaScript syntax
        run: |
          cd apps/api
          npm install
          find src -name "*.js" -print0 | xargs -0 -n1 node --check
      - name: Validate Python cleaning engine
        run: |
          cd apps/api
          python -m unittest discover -s python -p 'test_*.py' -v
      - name: Validate Cloudflare D1 schema
        run: |
          python - <<'PY'
          import sqlite3
          from pathlib import Path
          schema = Path("database/d1/0001_initial.sql").read_text()
          db = sqlite3.connect(":memory:")
          db.execute("PRAGMA foreign_keys = ON")
          db.executescript(schema)
          tables = {row[0] for row in db.execute("SELECT name FROM sqlite_master WHERE type='table'")}
          expected = {"users", "organizations", "memberships", "invitations", "audit_logs", "organization_access_requests", "projects", "tasks", "datasets", "dataset_versions", "dataset_validation_runs", "dataset_anomaly_runs", "reports", "notifications", "auth_tokens", "sessions"}
          missing = expected - tables
          assert not missing, f"Missing D1 tables: {sorted(missing)}"
          print(f"D1 schema valid: {len(expected)} tables created.")
          PY
      - name: Build web application
        run: |
          cd apps/web
          npm install
          npm run build
          npm run cf:build
