name: NEXUS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate API JavaScript syntax
        run: |
          cd apps/api
          npm install
          find src -name "*.js" -print0 | xargs -0 -n1 node --check
      - name: Validate Python cleaning engine
        run: |
          cd apps/api
          python -m unittest discover -s python -p 'test_*.py' -v
      - name: Validate all Cloudflare D1 migrations
        run: |
          python - <<'PY'
          import sqlite3
          from pathlib import Path
          db = sqlite3.connect(":memory:")
          db.execute("PRAGMA foreign_keys = ON")
          migrations = sorted(Path("database/d1").glob("*.sql"))
          assert migrations, "No D1 migrations found"
          for migration in migrations:
              db.executescript(migration.read_text())
              print(f"Applied {migration.name}")
          tables = {row[0] for row in db.execute("SELECT name FROM sqlite_master WHERE type='table'")}
          expected = {"users", "organizations", "memberships", "invitations", "audit_logs", "organization_access_requests", "projects", "tasks", "datasets", "dataset_versions", "dataset_validation_runs", "dataset_anomaly_runs", "reports", "notifications", "auth_tokens", "sessions", "auth_attempts"}
          missing = expected - tables
          assert not missing, f"Missing D1 tables: {sorted(missing)}"
          print(f"D1 schema valid: {len(expected)} tables created.")
          PY
      - name: Type-check Cloudflare API Worker
        run: |
          cd apps/api-worker
          npm install
          npm run typecheck
      - name: Build web application
        run: |
          cd apps/web
          npm install
          npm run build
          npm run cf:build
