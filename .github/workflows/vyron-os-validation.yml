name: VyronOS Validation
on:
  push:
    branches:
      - vyron-os-foundation
    paths:
      - 'vyron-os/**'
      - '.github/workflows/vyron-os-validation.yml'
  pull_request:
    branches:
      - vyron-os-foundation
    paths:
      - 'vyron-os/**'
      - '.github/workflows/vyron-os-validation.yml'
  workflow_dispatch:
jobs:
  structural-validation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install SVG validator
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils
      - name: Run VyronOS checks
        run: bash vyron-os/scripts/ci-check.sh
